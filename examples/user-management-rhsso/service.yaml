kind: service
name: user-management
archetype: rest-crud
language: go
base_path: /api/user-mgmt/v1
error_type_base: https://api.example.com/errors/

# The runtime data path: each operation runs in the transaction of the caller's tenant, is decided for the
# verified caller in SpiceDB, and leaves an audit row.
tenancy:
  kind: pooled
  key: tenant_id
  claim: org_id
  provisioning: {resource_type: service, provision: provision, retire: retire}
authorization:
  provider: spicedb
  schema_path: authz/schema.zed
  subject_from_identity: user
audit:
  level: change

entities:
  - name: Organization
    resource_type: organization
    permissions: {create: public, read: view, list: view, delete: edit}
    public_reasons: {create: a new organization has no resource to decide on before it exists}
    fields:
      - { name: name, type: string, unique: true, min_length: 1, max_length: 255 }
      - { name: description, type: string, optional: true, max_length: 1000 }

  - name: User
    resource_type: member
    permissions: {create: public, read: view, list: view, update: edit, patch: edit, delete: edit}
    public_reasons: {create: a new user is decided on edit of its organization through the reference org_id}
    references:
      org_id: {relation: organization, permission: edit}
    fields:
      - { name: email, type: string, unique: true, max_length: 255 }
      - { name: display_name, type: string, min_length: 1, max_length: 100 }
      - { name: role, type: enum, values: [admin, member, viewer] }
      - { name: org_id, type: ref, to: Organization }
      - { name: metadata, type: jsonb, optional: true }

  - name: OrgSetting
    resource_type: org_setting
    permissions: {read: view, list: view, upsert: edit}
    references:
      org_id: {relation: organization, permission: edit}
    fields:
      - { name: org_id, type: ref, to: Organization }
      - { name: key, type: string, max_length: 255 }
      - { name: value, type: jsonb }
      - { name: generation, type: int64 }

collections:
  organizations:
    entity: Organization
    operations: [create, read, delete, list]

  org-users:
    entity: User
    scope: { org_id: Organization }
    operations: [create, read, update, delete, list, patch]
    patchable: [display_name, role, metadata]

  all-users:
    entity: User
    operations: [list]

  org-settings:
    entity: OrgSetting
    scope: { org_id: Organization }
    operations: [list, upsert]
    upsert_key: [org_id, key]

slots:
  - collection: org-users
    slot: before_create
    gate:
      - rbac-policy
      - admin-creation-policy

  - collection: org-users
    slot: on_entity_changed
    fan-out:
      - user-change-notifier
      - audit-logger

  - collection: organizations
    slot: before_create
    chain:
      - org-name-validator
      - org-provisioner
    short_circuit: true

# The change events of the collections go to Kafka through the outbox (ST-SUP-Q103 (a)).
mixins:
  - event-publisher

overrides:
  auth-provider: rh-sso-auth
  rh-sso-auth:
    issuer: https://sso.example.com/auth/realms/example
    audience: user-management
  postgres-adapter:
    schema_generation: tables-v1
    writer_lease: "off"
