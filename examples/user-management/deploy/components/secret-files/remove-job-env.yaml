# The opt-in kustomize Component secret-files of the service. stego apply writes this file from the platform
# requirements. An overlay that lists this folder under components gets each secret as a read-only file under
# /var/run/secrets/stego in place of an environment variable. Each file has the mode 0400: give the pod an
# fsGroup, as the restricted SCC of OpenShift does, or list the Component fs-group on another cluster, and do not
# widen the mode. Do not edit it.
apiVersion: batch/v1
kind: Job
metadata:
  name: user-management-migrate-d1269c9162
spec:
  template:
    spec:
      containers:
        - env:
            - $patch: delete
              name: STEGO_MIGRATION_DATABASE_URL
            - $patch: delete
              name: STEGO_SPICEDB_KEY_FILE
          name: user-management
