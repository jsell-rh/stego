name: Go OpenAPI checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openapi-go.yml'
      - 'internal/openapicontract/**'
      - 'internal/generator/gosdk/**'
      - 'internal/generator/httpapplication/**'
      - 'internal/compiler/http_responses_test.go'
      - 'registry/components/http-application/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: openapi-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check common Go generation and SDK behavior
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openapi-go"
          git rev-parse HEAD > "$RUNNER_TEMP/openapi-go/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/openapi-go/source-archive.sha256"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=6m \
            ./internal/openapicontract ./internal/generator/gosdk \
            | tee "$RUNNER_TEMP/openapi-go/tests.jsonl"
          go test -json -race -count=1 -mod=readonly -timeout=3m \
            -run='^Test(HTTPResponseMappingValidation|HTTPResponseInputsAndDeterminism|GeneratedHTTPResponseMappings)$' \
            ./internal/generator/httpapplication \
            | tee -a "$RUNNER_TEMP/openapi-go/tests.jsonl"
          go test -json -race -count=1 -mod=readonly -timeout=1m \
            -run='^TestHTTPResponseMappingsGateOutput$' ./internal/compiler \
            | tee -a "$RUNNER_TEMP/openapi-go/tests.jsonl"
          python3 - "$RUNNER_TEMP/openapi-go/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          assert not any(e.get('Action') in ('fail', 'skip') for e in events)
          groups = {
              'internal/openapicontract': {
                  'TestGoClientPreservesPreviousBackendOutput',
                  'TestGoModelsPreservePresenceWithoutClient',
                  'TestGoBackendRejectsInvalidSelection',
                  'TestGoBackendConcurrentProfiles',
                  'TestGoResponseObjectBindings',
                  'TestGoResponseBindingsRejectAmbiguity',
                  'TestGoResponseBindingsCapturedReferences',
                  'TestGoResponseBindingsConcurrentBackend',
              },
              'internal/generator/gosdk': {
                  'TestInputBoundary', 'TestGeneratedSDK', 'TestCapturedReferenceNames',
                  'TestGeneratedNameConflicts', 'TestGeneratedSDK/false', 'TestGeneratedSDK/true',
              },
              'internal/generator/httpapplication': {
                  'TestHTTPResponseMappingValidation', 'TestHTTPResponseInputsAndDeterminism',
                  'TestGeneratedHTTPResponseMappings',
              },
              'internal/compiler': {'TestHTTPResponseMappingsGateOutput'},
          }
          for suffix, required in groups.items():
              package = 'github.com/jsell-rh/stego/' + suffix
              passed = {e.get('Test') for e in events
                        if e.get('Package') == package and e.get('Action') == 'pass'}
              assert required <= passed
              assert any(e.get('Package') == package and e.get('Action') == 'pass'
                         and not e.get('Test') for e in events)
          PYCHECK
          git diff --exit-code
      - name: Retain Go OpenAPI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi-go-${{ github.sha }}
          path: ${{ runner.temp }}/openapi-go/
          if-no-files-found: error
          retention-days: 14
