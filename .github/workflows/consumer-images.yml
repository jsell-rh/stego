name: Consumer image targets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/consumer-images.yml
      - .github/workflows/application-target.yml
      - .github/workflows/application-images.yml
      - scripts/application-build-matrix.py
      - scripts/test_application_matrix.py
      - scripts/check-application-build.py
      - scripts/check-application-image.py
      - scripts/check-application-registry.py
      - scripts/registry-fixture.go
      - internal/appbuild/**
      - cmd/stego/build.go
      - cmd/stego/image.go
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: consumer-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/application-images.yml
    with:
      application-repository: jsell-rh/hypershell-stego
      application-revision: 179293ccd172a9ef191613da47268add65eb22b8
      signer-revision: ${{ github.sha }}
