name: Specification checks

# The Lathe model under data/ is the specification. This job loads it with the Lathe release the
# repository pins and fails on any error: data that breaks the model, a test file that lacks the ID
# of its test record, a manual test in STEGO's own spec, a component or runtime package no aggregate
# lists. Warnings (not built, not proved) are reported and do not fail the job; the ratchet that
# refuses a change under which coverage falls is Assuring's gate (ST-ASR-UC02), which runs here once
# it is written.
#
# Lathe is a public repository, so the job reads it with no credential. The ref below is the Lathe commit
# stego's data is for; move it together
# with lathe.config.json's schema.

on:
  workflow_dispatch:
  # A branch gets the check from its pull request, so only a push to main runs it on push.
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'lathe.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '**/*_test.go'
      - 'scripts/test_*.py'
      - '.github/workflows/spec.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  # A push to main and a dispatch each have a group of their own, so no run on main is cancelled or replaced.
  # Only a pull request shares its group, by its number, so a newer push to it cancels its older run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # .github/workflows/proof-run.yml pins the same Lathe commit for its suites and gate jobs: move both together.
  LATHE_REF: c9a591d85abc350f0d9854f6e7af11e4a1b5f777

jobs:
  check:
    name: lathe check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: stego
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Jared4Robertson/lathe
          ref: ${{ env.LATHE_REF }}
          path: lathe
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - name: Build the pinned Lathe
        working-directory: lathe/lathe
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc -p tsconfig.build.json
          chmod +x dist/bin/lathe.js
      - name: Load and check the specification
        working-directory: stego
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/lathe check
