name: Proof run

# Attest a proof run (ST-ASR-UC01). The job runs the Go and Python suites at the commit it checked out, assure
# record writes an outcome for every automated test record in the spec at that commit, and GitHub's attestation
# action signs the proof run with this workflow's keyless identity, the trusted signer of a proof run, and keeps
# it. The commit is the subject. The job cannot write to the repository: the suites' output and the predicate
# are under the runner's temporary folder, outside the checkout, and nothing is committed (ST-ASR-A1-SR01).
#
# A failed test does not stop the job: the proof run records it, and the gates read the attestation. assure
# record stops the job, and nothing is attested, when a test names an unknown ID or the tree has uncommitted
# changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof-run:
    name: proof run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 # 18.6-alpine
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - run: npm ci --prefix internal/generator/typescriptsdk/testdata --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix internal/generator/browsertelemetry/testdata --ignore-scripts --no-audit --no-fund
      - name: Run the Go suites
        env:
          STEGO_REQUIRE_NODE: '1'
          STEGO_REQUIRE_POSTGRES: '1'
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: go test -json -race -count=1 -mod=readonly ./... > "$RUNNER_TEMP/go-test.json" || true
      - name: Run the Python suites
        run: python3 -B scripts/run-python-tests.py --output "$RUNNER_TEMP/python-tests.json"
      - name: Record the proof run
        id: record
        run: >-
          go run -mod=readonly ./cmd/assure record
          --commit "$GITHUB_SHA"
          --go-json "$RUNNER_TEMP/go-test.json"
          --python-json "$RUNNER_TEMP/python-tests.json"
          --predicate "$RUNNER_TEMP/proof-run.json"
      - name: Sign and keep the proof run
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.record.outputs.subject-name }}
          subject-digest: ${{ steps.record.outputs.subject-digest }}
          predicate-type: ${{ steps.record.outputs.predicate-type }}
          predicate-path: ${{ steps.record.outputs.predicate-path }}
