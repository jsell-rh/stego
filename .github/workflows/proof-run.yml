name: Proof run

# Attest a proof run (ST-ASR-UC01). The suites job runs the Go and Python suites at the commit, and assure record
# writes an outcome for every automated test record in the spec at that commit. The attest job runs no code of the
# repository: it names the commit as the subject, and GitHub's attestation action signs the proof run with this
# workflow's keyless identity, the trusted signer of a proof run, and keeps it. Only the attest job can get an
# identity token, so no test can sign or change what is signed after the suites job ends. Nothing is committed
# (ST-ASR-A1-SR01): the suites job can only read the repository, and the predicate stays outside the checkout.
#
# On a pull request the commit is the pull request's head, a commit that exists in the repository; on a push it is
# the commit pushed. A failed test does not stop the run: the proof run records it, and the gates read the
# attestation. assure record stops the run, and nothing is attested, when a test names an unknown ID or the tree
# has uncommitted changes.
#
# On a pull request, the gate job then gates the change (ST-ASR-UC02): it hears that the proof run is attested
# (ST-ASR-PO01), reads the attestation from GitHub's store, verifies it, and measures the coverage at the head and
# at the base with the pinned Lathe. It runs assure as built from the base commit, never from the change
# (ST-ASR-UC02-R07). A refused change fails the job. The suites job and the gate job read Lathe, a
# private repository, with the read-only deploy key in the secret LATHE_DEPLOY_KEY, at LATHE_REF, as the
# specification checks do; the checkouts sit side by side, stego and lathe, so stego's package.json finds it. Only
# the steps that need the key see it: the code of the repository runs in later steps.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push has a group of its own: each push to main gets its release decision and its release (ST-DIS-UC11-R04),
# and a newer push must not replace the pending run of an older one. A newer pull request run cancels the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # The Lathe commit stego's data is for. .github/workflows/spec.yml pins the same commit: move both together.
  LATHE_REF: 004ff3d7bb9cefee1b764d923d8909a032a4bfde

jobs:
  suites:
    name: suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 # 18.6-alpine
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK: '1'
    defaults:
      run:
        working-directory: stego
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          path: stego
          fetch-depth: 0
          persist-credentials: false
      - name: Require the Lathe deploy key
        env:
          LATHE_DEPLOY_KEY: ${{ secrets.LATHE_DEPLOY_KEY }}
        run: |
          if [ -z "$LATHE_DEPLOY_KEY" ]; then
            echo "::error::LATHE_DEPLOY_KEY is not set. The suites need the pinned Lathe for the tests that measure coverage."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Jared4Robertson/lathe
          ref: ${{ env.LATHE_REF }}
          ssh-key: ${{ secrets.LATHE_DEPLOY_KEY }}
          path: lathe
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            stego/go.sum
            stego/internal/assure/go.sum
            stego/cmd/assure/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - name: Build the pinned Lathe
        working-directory: lathe/lathe
        run: |
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc -p tsconfig.build.json
          chmod +x dist/bin/lathe.js
      - name: Install the pinned Lathe
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix internal/generator/typescriptsdk/testdata --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix internal/generator/browsertelemetry/testdata --ignore-scripts --no-audit --no-fund
      # The code standard's own-tree tests (ST-STD-CODE-R01-T01 to R06-T01) refuse a fault that the base's list of
      # known faults does not hold. ASSURE_RATCHET_BASE names that base: on a pull request, the merge base of the
      # pull request's base and its head, not main's tip, so a branch behind main is not failed for lines main has
      # since removed. On a push to main it is unset, and the tests take HEAD^1.
      - name: Name the ratchet base of the code standard
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE"
          merge_base="$(git merge-base "$BASE" HEAD)"
          echo "ASSURE_RATCHET_BASE=$merge_base" >> "$GITHUB_ENV"
      - name: Run the Go suites
        timeout-minutes: 25
        env:
          STEGO_REQUIRE_NODE: '1'
          STEGO_REQUIRE_POSTGRES: '1'
          STEGO_REQUIRE_LATHE: '1'
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        # go test ./... at the root does not reach Assuring's modules, internal/assure and cmd/assure: each has a
        # go.mod of its own. Their events go into the same file, after the root's, and assure record reads the file
        # as one run.
        run: |
          go test -json -race -count=1 -mod=readonly ./... > "$RUNNER_TEMP/go-test.json" || true
          for module in internal/assure cmd/assure; do
            go test -C "$module" -json -race -count=1 -mod=readonly ./... >> "$RUNNER_TEMP/go-test.json" || true
          done
      - name: Run the Python suites
        timeout-minutes: 5
        run: python3 -B scripts/run-python-tests.py --output "$RUNNER_TEMP/python-tests.json"
      - name: Record the proof run
        run: >-
          mkdir -p "$RUNNER_TEMP/proof-run" &&
          go run -C cmd/assure -mod=readonly . record
          --commit "$COMMIT"
          --go-json "$RUNNER_TEMP/go-test.json"
          --python-json "$RUNNER_TEMP/python-tests.json"
          --predicate "$RUNNER_TEMP/proof-run/proof-run.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-run
          path: ${{ runner.temp }}/proof-run/proof-run.json
          retention-days: 14
          if-no-files-found: error

  attest:
    name: attest
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: proof-run
          path: ${{ runner.temp }}/proof-run
      - name: Check that the predicate is about the commit
        run: test "$(jq -r .commit "$RUNNER_TEMP/proof-run/proof-run.json")" = "$COMMIT"
      - name: Name the commit as the subject
        id: subject
        run: |
          case "$COMMIT" in
            *[!0-9a-f]*) echo "::error::$COMMIT is not a full commit ID"; exit 1 ;;
          esac
          test "${#COMMIT}" -eq 40
          digest="$(printf '%s' "$COMMIT" | sha256sum | cut -d ' ' -f 1)"
          echo "name=git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$COMMIT" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - name: Sign and keep the proof run
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: https://github.com/jsell-rh/stego/assure/proof-run/v1
          predicate-path: ${{ runner.temp }}/proof-run/proof-run.json

  gate:
    name: gate
    needs: attest
    # !cancelled(): when the suites or the attest job fail, the gate still runs and refuses the change for want of a
    # verified proof run, because GitHub counts a skipped required check as passed. A cancelled run does not gate.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The gate is the base's own code (ST-ASR-UC02-R07). The job checks out the base commit into the folder base,
    # beside the change's checkout, builds assure from the base's cmd/assure and internal/assure there, and runs that
    # binary in the change's checkout, with the Lathe that this workflow builds from LATHE_REF. The change's tree is
    # only data to the decision: no step of this job runs, builds or installs code from it. While the gate can pass,
    # this workflow file is the base's own, as a change that alters it has a change-grade proof run, which the gate
    # refuses (ST-ASR-UC02-R06): so LATHE_REF is the Lathe that the base's workflow pins.
    #
    # The job restores no cache: a cache that another job wrote, also one a change's own run wrote, could hold
    # module or build files that go build does not check again. The change's spec is data that Lathe runs, so before
    # the gate step the job makes Lathe and the built binary read-only, and assure measures the base before the
    # change: the change's run cannot alter the Lathe or the binary that decide.
    steps:
      - name: Require the Lathe deploy key
        env:
          LATHE_DEPLOY_KEY: ${{ secrets.LATHE_DEPLOY_KEY }}
        run: |
          if [ -z "$LATHE_DEPLOY_KEY" ]; then
            echo "::error::The gate did not run: LATHE_DEPLOY_KEY is not set, and the gate needs the pinned Lathe to measure the coverage. This is no decision on the change."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          path: stego
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Jared4Robertson/lathe
          ref: ${{ env.LATHE_REF }}
          ssh-key: ${{ secrets.LATHE_DEPLOY_KEY }}
          path: lathe
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - name: Build the pinned Lathe
        working-directory: lathe/lathe
        run: |
          if ! { npm ci --no-audit --no-fund && ./node_modules/.bin/tsc -p tsconfig.build.json && chmod +x dist/bin/lathe.js; }; then
            echo "::error::The gate did not run: the pinned Lathe did not build. This is no decision on the change."
            exit 1
          fi
      - name: Build assure from the base commit
        working-directory: base/cmd/assure
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          if ! go build -mod=readonly -trimpath -o "$RUNNER_TEMP/gate/assure" .; then
            echo "::error::The gate did not run: assure did not build from the base commit. This is no decision on the change."
            exit 1
          fi
      # setup-go registers a problem matcher, owner go, that reads each line "<file>.go: <message>" as a compiler
      # error. The gate prints no compiler output: remove the matcher, so no code fault or reason is an annotation.
      - name: Remove the Go problem matcher
        run: echo "::remove-matcher owner=go::"
      - name: Make Lathe and assure read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE/lathe" "$RUNNER_TEMP/gate"
      - name: Gate the change
        id: gate
        working-directory: stego
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/gate/assure" gate change --commit "$COMMIT" --base "$BASE"
          --lathe "$GITHUB_WORKSPACE/lathe/lathe/dist/bin/lathe.js"
      - name: Say that the gate did not run
        # The gate step did not run when its outcome is not failure: it was skipped, or it has none.
        if: ${{ failure() && steps.gate.outcome != 'failure' }}
        run: echo "::error::The gate did not run, because a step before it failed. This is no decision on the change."
      # The runner's post steps clean up the checkouts, so they get write access back after the gate.
      - name: Make Lathe and assure writable again
        if: ${{ always() }}
        run: |
          for folder in "$GITHUB_WORKSPACE/lathe" "$RUNNER_TEMP/gate"; do
            if [ -e "$folder" ]; then chmod -R u+w "$folder"; fi
          done

  # Gate a release (ST-ASR-UC03). On each push to main, once the proof run is attested, the gate-release job gates
  # the commit pushed on its own: every obligation designed, built and proved, every automated proof passed in a
  # proof run signed at main, and no code-standard fault in the tree. It reads the attestation from GitHub's store,
  # verifies it, and measures the coverage with the pinned Lathe, as the gate job does. It builds assure, so that the
  # step sees assure's own exit code, which go run does not pass on.
  #
  # A refused release is a neutral outcome (ST-DIS-UC11-R04): assure exits 1, prints the decision and one notice
  # line, and writes no predicate; the step ends green with the job output passed=false. Only a run that reaches no
  # decision (exit 2, or a step before the gate that fails) fails the job. A passed decision (exit 0, passed=true)
  # is written as decision.json under the runner's temporary folder, outside the checkout, and uploaded; only then
  # the attest-release job runs. It runs no code of the repository, names the commit as the subject as the attest
  # job does, and has GitHub's attestation action sign the decision with this workflow's keyless identity at main
  # and keep it (ST-ASR-INV09), so release qualification can verify it.
  #
  # The gate-release job restores no cache, as the gate job: a cache that another job wrote could hold module or
  # build files that go build does not check again.
  gate-release:
    name: gate release
    needs: attest
    # !cancelled(): when the suites or the attest job fail, the release gate still runs and refuses the release for
    # want of a verified proof run.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - name: Require the Lathe deploy key
        env:
          LATHE_DEPLOY_KEY: ${{ secrets.LATHE_DEPLOY_KEY }}
        run: |
          if [ -z "$LATHE_DEPLOY_KEY" ]; then
            echo "::error::LATHE_DEPLOY_KEY is not set. The release gate needs the pinned Lathe to measure the coverage."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          path: stego
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Jared4Robertson/lathe
          ref: ${{ env.LATHE_REF }}
          ssh-key: ${{ secrets.LATHE_DEPLOY_KEY }}
          path: lathe
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - name: Build the pinned Lathe
        working-directory: lathe/lathe
        run: |
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc -p tsconfig.build.json
          chmod +x dist/bin/lathe.js
      - name: Build assure
        working-directory: stego/cmd/assure
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/release/assure" .
      # setup-go registers a problem matcher, owner go, that reads each line "<file>.go: <message>" as a compiler
      # error. The gate prints no compiler output: remove the matcher, so no code fault or reason is an annotation.
      - name: Remove the Go problem matcher
        run: echo "::remove-matcher owner=go::"
      - name: Gate the release
        id: gate
        working-directory: stego
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/decision"
          status=0
          "$RUNNER_TEMP/release/assure" gate release --commit "$COMMIT" --predicate "$RUNNER_TEMP/decision/decision.json" --lathe "$GITHUB_WORKSPACE/lathe/lathe/dist/bin/lathe.js" || status=$?
          case "$status" in
            0) echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "passed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.passed == 'true' }}
        with:
          name: release-decision
          path: ${{ runner.temp }}/decision/decision.json
          retention-days: 14
          if-no-files-found: error

  attest-release:
    name: attest release
    needs: gate-release
    # Only a passed release decision is signed. gate-release runs only on a push to main, so this job never runs on
    # a pull request either.
    if: ${{ needs.gate-release.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-decision
          path: ${{ runner.temp }}/decision
      - name: Check that the predicate is a passed release decision about the commit
        run: test "$(jq -r '[.commit, .kind, (.passed | tostring)] | join(" ")' "$RUNNER_TEMP/decision/decision.json")" = "$COMMIT release true"
      - name: Name the commit as the subject
        id: subject
        run: |
          case "$COMMIT" in
            *[!0-9a-f]*) echo "::error::$COMMIT is not a full commit ID"; exit 1 ;;
          esac
          test "${#COMMIT}" -eq 40
          digest="$(printf '%s' "$COMMIT" | sha256sum | cut -d ' ' -f 1)"
          echo "name=git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$COMMIT" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - name: Sign and keep the release decision
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: https://github.com/jsell-rh/stego/assure/release-decision/v1
          predicate-path: ${{ runner.temp }}/decision/decision.json

  # Publish a compiler release (ST-DIS-UC11). The publish-release job hears Release decided (ST-DIS-PO06): it needs
  # the attest-release job and runs only when the release gate passed, so on a push to main only, in the same run as
  # the decision. A refused decision skips it: nothing is published, and the run stays green with the gate's notice
  # line (ST-DIS-UC11-R04). It is the only job that can write releases, and it runs no code of the repository
  # (ST-DIS-UC11-R05): it checks out nothing, and its steps are shell with gh, jq, unzip and coreutils only.
  #
  # It does not trust the job outputs it follows. It verifies the release decision itself, as a consumer does
  # (ST-DIS-UC11-R01). It finds the signed artifact run of compiler-artifact.yml at the commit, which starts from the
  # same push and can still run, and waits for it within a bound. It downloads the compiler artifact and the
  # signature bundle by their artifact IDs, checks each archive against the digest that GitHub lists for that ID,
  # and verifies the executable and the build record against their signatures from that run (ST-DIS-UC11-R02). It
  # refuses a tag or a release that exists, then creates compiler-<commit> at the full commit with exactly the four
  # assets, never the latest, and fails when the release is not immutable or is the latest (ST-DIS-UC11-R03).
  # Release immutability is a repository setting: the job cannot set it, so it fails when the setting is off.
  # The job output release names the tag: it is Compiler release published (ST-DIS-EV08).
  #
  # actions: read lets the job list the runs and download their artifacts by ID; contents: write lets it create the
  # release and its tag. The job gets no identity token and writes no attestation.
  publish-release:
    name: publish release
    needs: [gate-release, attest-release]
    if: ${{ needs.gate-release.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: jsell-rh/stego
    outputs:
      release: ${{ steps.publish.outputs.release }}
    steps:
      - name: Verify the passed release decision at the commit
        run: |
          set -euo pipefail
          case "$COMMIT" in
            ''|*[!0-9a-f]*) echo "::error::$COMMIT is not a full commit ID. Nothing is published."; exit 1 ;;
          esac
          test "${#COMMIT}" -eq 40
          work="$RUNNER_TEMP/publish"
          mkdir -p "$work"
          # The subject of the decision is the commit ID: this file holds exactly its bytes.
          printf '%s' "$COMMIT" > "$work/commit"
          if ! gh attestation verify "$work/commit" --hostname github.com --repo "$REPOSITORY" \
            --signer-digest "$COMMIT" \
            --cert-identity "https://github.com/$REPOSITORY/.github/workflows/proof-run.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref refs/heads/main --source-digest "$COMMIT" \
            --predicate-type https://github.com/jsell-rh/stego/assure/release-decision/v1 \
            --digest-alg sha256 --deny-self-hosted-runners --format json > "$work/decision.json"; then
            echo "::error::No release decision attested at $COMMIT by proof-run.yml at refs/heads/main verifies. Nothing is published."
            exit 1
          fi
          if ! jq -e --arg commit "$COMMIT" 'type == "array" and any(.[];
              .verificationResult.signature.certificate.sourceRepositoryDigest == $commit
              and .verificationResult.statement.predicate.commit == $commit
              and .verificationResult.statement.predicate.kind == "release"
              and .verificationResult.statement.predicate.passed == true)' "$work/decision.json" > /dev/null; then
            echo "::error::No passed release decision is attested at $COMMIT. Nothing is published."
            exit 1
          fi
          echo "The release decision at $COMMIT passed, signed by proof-run.yml at refs/heads/main."
      - name: Find the signed artifact run at the commit
        env:
          RUN_WAIT_SECONDS: '2700'
          RUN_POLL_SECONDS: '30'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish"
          deadline=$((SECONDS + RUN_WAIT_SECONDS))
          while :; do
            gh api --hostname github.com "repos/$REPOSITORY/actions/runs?head_sha=$COMMIT&per_page=100" > "$work/runs.json"
            jq -e '.total_count <= 100 and (.workflow_runs | type == "array")' "$work/runs.json" > /dev/null
            # The newest successful run of compiler-artifact.yml on main at exactly the commit, from a push or a
            # dispatch of main: the provenance job signs only there.
            found="$(jq -r --arg commit "$COMMIT" '[.workflow_runs[] | select(.path == ".github/workflows/compiler-artifact.yml"
                and .head_sha == $commit and .head_branch == "main"
                and (.event == "push" or .event == "workflow_dispatch")
                and .status == "completed" and .conclusion == "success")]
              | max_by(.id) | if . == null then "" else "\(.id) \(.run_attempt)" end' "$work/runs.json")"
            if [ -n "$found" ]; then
              echo "$found" > "$work/run"
              break
            fi
            seen="$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/compiler-artifact.yml")
              | "\(.id) (\(.event) on \(.head_branch), \(.status), \(.conclusion // "no conclusion"))"] | join(", ")' "$work/runs.json")"
            # When every run of compiler-artifact.yml at the commit has completed and none is a success on main,
            # waiting cannot help.
            if jq -e '[.workflow_runs[] | select(.path == ".github/workflows/compiler-artifact.yml")]
                | length > 0 and all(.[]; .status == "completed")' "$work/runs.json" > /dev/null; then
              echo "::error::Every run of compiler-artifact.yml at $COMMIT has completed, and none succeeded on main from a push or a dispatch. Runs at the commit: $seen. Nothing is published."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No run of compiler-artifact.yml at $COMMIT on main succeeded within $RUN_WAIT_SECONDS seconds. Runs at the commit: ${seen:-none}. Nothing is published."
              exit 1
            fi
            sleep "$RUN_POLL_SECONDS"
          done
          read -r run attempt < "$work/run"
          echo "The signed artifact run is $run, attempt $attempt."
      - name: Fetch the four assets by their artifact IDs and verify them
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish"
          read -r run attempt < "$work/run"
          gh api --hostname github.com "repos/$REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$work/artifacts.json"
          jq -e '.total_count <= 100 and (.artifacts | type == "array") and (.artifacts | length) == .total_count' "$work/artifacts.json" > /dev/null
          for kind in compiler-linux-amd64 compiler-attestation; do
            name="$kind-$COMMIT"
            if ! jq -e --arg name "$name" '[.artifacts[] | select(.name == $name)] | length == 1' "$work/artifacts.json" > /dev/null; then
              echo "::error::Run $run does not hold exactly one artifact $name. Nothing is published."
              exit 1
            fi
            jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | "\(.id) \(.digest) \(.expired)"' "$work/artifacts.json" > "$work/$kind.identity"
            read -r id digest expired < "$work/$kind.identity"
            case "$id" in
              ''|*[!0-9]*) echo "::error::The artifact $name has no valid ID. Nothing is published."; exit 1 ;;
            esac
            if [ "$expired" != false ] || ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The artifact $name (ID $id) expired or has no valid digest. Nothing is published."
              exit 1
            fi
            # A fixed API path with the immutable artifact ID, never a name or a URL from a response.
            gh api --hostname github.com "repos/$REPOSITORY/actions/artifacts/$id/zip" > "$work/$kind.zip"
            if [ "sha256:$(sha256sum "$work/$kind.zip" | cut -d ' ' -f 1)" != "$digest" ]; then
              echo "::error::The artifact $name (ID $id) does not match the digest that run $run lists for it. Nothing is published."
              exit 1
            fi
          done
          # Each archive holds exactly the files the signed artifact run puts in it, and nothing else.
          if [ "$(unzip -Z1 "$work/compiler-linux-amd64.zip" | LC_ALL=C sort | tr '\n' ' ')" != "SHA256SUMS build.json stego-linux-amd64 " ] \
            || [ "$(unzip -Z1 "$work/compiler-attestation.zip" | tr '\n' ' ')" != "attestation.json " ]; then
            echo "::error::The artifacts of run $run do not hold exactly the executable, its build record, SHA256SUMS and the signature bundle. Nothing is published."
            exit 1
          fi
          assets="$work/assets"
          rm -rf "$assets"
          mkdir "$assets"
          unzip -q "$work/compiler-linux-amd64.zip" -d "$assets"
          unzip -p "$work/compiler-attestation.zip" attestation.json > "$assets/provenance.jsonl"
          cd "$assets"
          # SHA256SUMS lists exactly the executable and the build record.
          if ! sha256sum stego-linux-amd64 build.json | cmp -s - SHA256SUMS; then
            echo "::error::SHA256SUMS of run $run does not match the executable and the build record. Nothing is published."
            exit 1
          fi
          # The compiler's signer policy, as scripts/verify-compiler-artifact.py holds it, and the signing run.
          for file in stego-linux-amd64 build.json; do
            if ! gh attestation verify "$file" --bundle provenance.jsonl --hostname github.com --repo "$REPOSITORY" \
              --signer-digest "$COMMIT" \
              --cert-identity "https://github.com/$REPOSITORY/.github/workflows/compiler-artifact.yml@refs/heads/main" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main --source-digest "$COMMIT" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --digest-alg sha256 --deny-self-hosted-runners --format json > "$work/$file.verified.json"; then
              echo "::error::The signature of $file from run $run does not verify. Nothing is published."
              exit 1
            fi
            if ! jq -e --arg run "https://github.com/$REPOSITORY/actions/runs/$run/attempts/$attempt" --arg commit "$COMMIT" \
              'type == "array" and length > 0 and all(.[];
                .verificationResult.signature.certificate.runInvocationURI == $run
                and .verificationResult.signature.certificate.sourceRepositoryDigest == $commit)' "$work/$file.verified.json" > /dev/null; then
              echo "::error::The signature of $file does not name run $run, attempt $attempt, at $COMMIT. Nothing is published."
              exit 1
            fi
          done
          binary_sha256="$(sha256sum stego-linux-amd64 | cut -d ' ' -f 1)"
          if ! jq -e --arg commit "$COMMIT" --arg sha256 "$binary_sha256" --argjson size "$(stat -c %s stego-linux-amd64)" '
              .format == 1 and .source_revision == $commit
              and .artifact == {"name": "stego-linux-amd64", "sha256": $sha256, "size": $size}
              and .version.build.goos == "linux" and .version.build.goarch == "amd64"
              and .version.build.revision == $commit and .version.build.vcs == "git"
              and .version.build.source_state == "clean"' build.json > /dev/null; then
            echo "::error::The signed build record does not describe this executable at $COMMIT. Nothing is published."
            exit 1
          fi
          echo "The four assets of run $run are verified."
      - name: Publish the release
        id: publish
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish"
          assets="$work/assets"
          read -r run attempt < "$work/run"
          tag="compiler-$COMMIT"
          # A release or a tag is never replaced (ST-DIS-INV10): an existing tag or release stops publishing.
          gh api --hostname github.com "repos/$REPOSITORY/git/matching-refs/tags/$tag" > "$work/tags.json"
          if ! jq -e --arg ref "refs/tags/$tag" 'type == "array" and all(.[]; .ref != $ref)' "$work/tags.json" > /dev/null; then
            echo "::error::The tag $tag exists. A tag is never replaced: the commit needs a new merge commit. Nothing is published."
            exit 1
          fi
          gh api --hostname github.com --paginate "repos/$REPOSITORY/releases?per_page=100" > "$work/releases.json"
          if ! jq -s -e --arg tag "$tag" 'all(.[]; type == "array" and all(.[]; .tag_name != $tag))' "$work/releases.json" > /dev/null; then
            echo "::error::A release $tag exists. A release is never replaced: the commit needs a new merge commit. Nothing is published."
            exit 1
          fi
          {
            echo "Compiler release from main at $COMMIT."
            echo
            echo "The release gate passed at this commit: proof-run.yml at refs/heads/main attested the release decision."
            echo "The compiler-artifact workflow run $run, attempt $attempt, built and signed the assets: https://github.com/$REPOSITORY/actions/runs/$run/attempts/$attempt"
            echo "Binary sha256: $(sha256sum "$assets/stego-linux-amd64" | cut -d ' ' -f 1)"
            echo "Build record sha256: $(sha256sum "$assets/build.json" | cut -d ' ' -f 1)"
          } > "$work/notes.md"
          gh release create "$tag" --repo "$REPOSITORY" --target "$COMMIT" --latest=false \
            --title "Compiler release $COMMIT" --notes-file "$work/notes.md" \
            "$assets/stego-linux-amd64" "$assets/build.json" "$assets/SHA256SUMS" "$assets/provenance.jsonl"
          gh api --hostname github.com "repos/$REPOSITORY/releases/tags/$tag" > "$work/release.json"
          ( cd "$assets" && for file in stego-linux-amd64 build.json SHA256SUMS provenance.jsonl; do
              echo "$file sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            done ) | LC_ALL=C sort > "$work/expected-assets"
          jq -r '.assets[] | "\(.name) \(.digest)"' "$work/release.json" | LC_ALL=C sort > "$work/published-assets"
          if ! jq -e --arg tag "$tag" --arg commit "$COMMIT" '.tag_name == $tag and .target_commitish == $commit
              and .draft == false and .prerelease == false and (.assets | length == 4)
              and all(.assets[]; .state == "uploaded")' "$work/release.json" > /dev/null \
            || ! cmp -s "$work/expected-assets" "$work/published-assets"; then
            echo "::error::The release $tag is not exactly the four verified assets at $COMMIT."
            exit 1
          fi
          gh api --hostname github.com "repos/$REPOSITORY/git/matching-refs/tags/$tag" > "$work/tags.json"
          if ! jq -e --arg ref "refs/tags/$tag" --arg commit "$COMMIT" '[.[] | select(.ref == $ref)]
              | length == 1 and .[0].object.type == "commit" and .[0].object.sha == $commit' "$work/tags.json" > /dev/null; then
            echo "::error::The tag $tag does not point at $COMMIT."
            exit 1
          fi
          if ! jq -e '.immutable == true' "$work/release.json" > /dev/null; then
            echo "::error::The release $tag is not immutable. The owner must enable release immutability in the repository settings, then delete this release and its tag; the commit needs a new merge commit to be published."
            exit 1
          fi
          gh api --hostname github.com graphql -f owner="${REPOSITORY%/*}" -f name="${REPOSITORY#*/}" -f tag="$tag" \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { isLatest } } }' \
            > "$work/latest.json"
          if ! jq -e '.data.repository.release.isLatest == false' "$work/latest.json" > /dev/null; then
            echo "::error::The release $tag is the latest release, and a compiler release is never the latest. The owner must mark the previous latest release as latest explicitly (make_latest), so that GitHub does not mark the newest release by date. Do not delete this release: its immutable tag can never be used again. It then stands as immutable and not the latest; qualify it by hand, in a checkout of the commit, with qualify-compiler-release.py --verify-release --revision $COMMIT --output <new folder> --gh <path of gh> from the scripts folder."
            exit 1
          fi
          url="$(jq -r .html_url "$work/release.json")"
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "Compiler release published: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  # Qualify the published release (ST-DIS-PO05): the qualify-release job hears Compiler release published through the
  # publish-release job's output, and runs scripts/qualify-compiler-release.py --verify-release for the commit in
  # the same run. The script verifies the passed release decision at the commit (ST-DIS-UC08-R04), requires the
  # checks run and the signed artifact run, and installs the release through the consumer path. It waits, within a
  # bound, for the checks run at the commit to complete, since that run starts from the same push. It may only read.
  qualify-release:
    name: qualify release
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: jsell-rh/stego
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Wait for the checks run at the commit
        env:
          RUN_WAIT_SECONDS: '1800'
          RUN_POLL_SECONDS: '30'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + RUN_WAIT_SECONDS))
          runs="$RUNNER_TEMP/checks-runs.json"
          while :; do
            gh api --hostname github.com "repos/$REPOSITORY/actions/runs?head_sha=$COMMIT&per_page=100" > "$runs"
            # The checks run starts from the same push as this run, so it exists by now, or it never will.
            if ! jq -e '[.workflow_runs[] | select(.path == ".github/workflows/checks.yml" and .head_branch == "main")]
                | length > 0' "$runs" > /dev/null; then
              echo "::error::No checks run exists at $COMMIT on main. The release is not qualified."
              exit 1
            fi
            if jq -e '[.workflow_runs[] | select(.path == ".github/workflows/checks.yml" and .head_branch == "main")]
                | all(.[]; .status == "completed")' "$runs" > /dev/null; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The checks run at $COMMIT did not complete within $RUN_WAIT_SECONDS seconds. The release is not qualified."
              exit 1
            fi
            sleep "$RUN_POLL_SECONDS"
          done
      - name: Qualify the published release through the consumer path
        env:
          RELEASE: ${{ needs.publish-release.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "compiler-$COMMIT" ]; then
            echo "::error::The published release $RELEASE is not the release of $COMMIT."
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 15m python3 -B scripts/qualify-compiler-release.py \
            --revision "$COMMIT" --output "$RUNNER_TEMP/qualification" --gh "$(command -v gh)" --verify-release
          echo "The release $RELEASE is qualified at $COMMIT."
