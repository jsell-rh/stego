name: Workload construction checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/workload-construction.yml'
      - 'internal/generator/kubernetesworkload/**'
      - 'registry/components/kubernetes-workload/**'

permissions:
  contents: read

concurrency:
  group: workload-construction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check generated workload construction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workload-construction"
          git rev-parse HEAD > "$RUNNER_TEMP/workload-construction/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/workload-construction/source-archive.sha256"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=3m ./internal/generator/kubernetesworkload \
            | tee "$RUNNER_TEMP/workload-construction/tests.jsonl"
          python3 - "$RUNNER_TEMP/workload-construction/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass'}
          assert {'TestWorkloadNamespaceAndConfiguration', 'TestGeneratedWorkloadConstruction'} <= passed
          assert not any(e.get('Action') in ('fail', 'skip') for e in events)
          nested = []
          for event in events:
              for line in event.get('Output', '').splitlines():
                  line = line.strip()
                  if line.startswith('{"Time":'):
                      nested.append(json.loads(line))
          required = {'TestWidgetSecurityAndService', 'TestWidgetInputsAreNotAliased',
                      'TestWidgetMultipleContainersAndProfiles', 'TestWidgetDependencyRollout',
                      'TestConfigurationDigestChangesOnlyWithContents', 'TestConfigurationDigestSeparatesObjectKinds',
                      'TestConfigurationDigestRejectsInvalidInput',
                      'TestWorkloadRejectsUnsafeOrAmbiguousInput'}
          assert required <= {e.get('Test') for e in nested if e.get('Action') == 'pass'}
          assert not any(e.get('Action') in ('fail', 'skip') for e in nested)
          PYCHECK
          git diff --exit-code
      - name: Retain construction results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workload-construction-${{ github.sha }}
          path: ${{ runner.temp }}/workload-construction/
          if-no-files-found: error
          retention-days: 14
