name: Compiler release qualification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compiler-release-qualification.yml'
      - 'scripts/qualify-compiler-release.py'
      - 'scripts/test_compiler_release_qualification.py'
      - 'scripts/verify-compiler-artifact.py'
      - 'scripts/install-compiler.py'
  pull_request:
    paths:
      - '.github/workflows/compiler-release-qualification.yml'
      - 'scripts/qualify-compiler-release.py'
      - 'scripts/test_compiler_release_qualification.py'
      - 'scripts/verify-compiler-artifact.py'
      - 'scripts/install-compiler.py'

permissions:
  contents: read
  attestations: read

concurrency:
  group: compiler-release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check qualification rejection paths
        run: timeout --signal=TERM --kill-after=5s 20s python3 -B scripts/test_compiler_release_qualification.py
      # Qualification of a published release reads the passed release
      # decision attested at its commit (ST-DIS-UC08-R04). The releases that
      # were published by hand before the release gate have no such decision,
      # so this workflow does not qualify one of them again. The qualify-release
      # job of proof-run.yml qualifies each release that the publish-release job
      # publishes, in the same run, through the consumer path (ST-DIS-PO05).
