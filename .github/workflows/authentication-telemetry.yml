name: Authentication key telemetry checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/authentication-telemetry.yml'
      - 'internal/generator/jwtauth/**'
      - 'internal/generator/oteltracing/**'
      - 'registry/components/jwt-auth/**'
      - 'registry/components/otel-tracing/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/authentication-telemetry.yml'
      - 'internal/generator/jwtauth/**'
      - 'internal/generator/oteltracing/**'
      - 'registry/components/jwt-auth/**'
      - 'registry/components/otel-tracing/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: authentication-telemetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check generated key refresh and signal boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authentication-telemetry"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=8m \
            ./internal/generator/jwtauth ./internal/generator/oteltracing \
            -run '^(TestGeneratedAuthenticationRuntime|TestAuthenticationTelemetryPeerValidation|TestGeneratedAuthKeyTelemetry)$' \
            | tee "$RUNNER_TEMP/authentication-telemetry/tests.jsonl"
          git rev-parse HEAD > "$RUNNER_TEMP/authentication-telemetry/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/authentication-telemetry/source-archive.sha256"
      - name: Retain key telemetry results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authentication-telemetry-${{ github.sha }}
          path: ${{ runner.temp }}/authentication-telemetry/
          if-no-files-found: error
          retention-days: 14
