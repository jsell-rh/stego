name: Outbox claim failure checks

on:
  workflow_dispatch:
  push:
    paths:
      - internal/generator/outbox/**
      - registry/components/outbox/**
      - .github/workflows/outbox-claims.yml

permissions:
  contents: read

concurrency:
  group: outbox-claims-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      STEGO_REQUIRE_POSTGRES: '1'
      STEGO_BENCH_OUTBOX: '0'
      STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK: '1'
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: stego_claim_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --cpus=1 --memory=512m --pids-limit=128
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check generated claims and recovery on PostgreSQL
        env:
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_claim_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/outbox-claims"
          git rev-parse HEAD > "$RUNNER_TEMP/outbox-claims/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/outbox-claims/source-archive.sha256"
          go test -json -race -count=1 -mod=readonly -timeout=5m ./internal/generator/outbox \
            -run '^TestGeneratedOutbox$' | tee "$RUNNER_TEMP/outbox-claims/tests.jsonl"
          git diff --exit-code
      - name: Retain claim test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: outbox-claims-${{ github.sha }}
          path: ${{ runner.temp }}/outbox-claims/
          retention-days: 14
          if-no-files-found: error
