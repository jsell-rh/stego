name: Controller cycle checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/controller-cycles.yml'
      - 'internal/generator/controller/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/controller-cycles.yml'
      - 'internal/generator/controller/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: controller-cycles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check generated cycle ordering, budgets, and recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller-cycles"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=10m ./internal/generator/controller \
            -run '^TestGenerated(CycleParallel|CycleActionBudget|CycleWindow|ScanCheckpoint|SequenceScan)$' \
            | tee "$RUNNER_TEMP/controller-cycles/tests.jsonl"
          git rev-parse HEAD > "$RUNNER_TEMP/controller-cycles/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/controller-cycles/source-archive.sha256"
      - name: Retain cycle check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controller-cycles-${{ github.sha }}
          path: ${{ runner.temp }}/controller-cycles/
          if-no-files-found: error
          retention-days: 14
