name: Timestamp conversion checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/timestamp-conversion.yml'
      - 'internal/generator/grpcapplication/**'
      - 'registry/components/grpc-application/**'
      - 'registry/components/grpc-processes/**'

permissions:
  contents: read

concurrency:
  group: timestamp-conversion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check required and optional protobuf instants
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/timestamp-conversion"
          git rev-parse HEAD > "$RUNNER_TEMP/timestamp-conversion/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/timestamp-conversion/source-archive.sha256"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=5m ./internal/generator/grpcapplication \
            -run '^TestGeneratedTimestampConversions$' \
            | tee "$RUNNER_TEMP/timestamp-conversion/tests.jsonl"
          python3 - "$RUNNER_TEMP/timestamp-conversion/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          assert not any(e.get('Action') in ('fail', 'skip') for e in events)
          assert 'TestGeneratedTimestampConversions' in {e.get('Test') for e in events if e.get('Action') == 'pass'}
          nested = []
          for event in events:
              for line in event.get('Output', '').splitlines():
                  line = line.strip()
                  if line.startswith('{"Time":'):
                      nested.append(json.loads(line))
          assert not any(e.get('Action') in ('fail', 'skip') for e in nested)
          required = {'TestTimestampSupportedInstants', 'TestTimestampRejectsInvalidInstantsWithoutOutput',
                      'TestOptionalTimestampPreservesPresenceAndOwnsOutput', 'TestTimestampDiscardsMonotonicState'}
          for namespace in ['grpcapi', 'rpc/provider']:
              package = 'example.com/timestamp-test/out/' + namespace + '/transport'
              passed = {e.get('Test') for e in nested if e.get('Action') == 'pass' and e.get('Package') == package and e.get('Test')}
              assert required <= passed and len(passed) == 17
              assert any(e.get('Action') == 'pass' and e.get('Package') == package and not e.get('Test') for e in nested)
          PYCHECK
          git diff --exit-code
      - name: Retain conversion results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: timestamp-conversion-${{ github.sha }}
          path: ${{ runner.temp }}/timestamp-conversion/
          if-no-files-found: error
          retention-days: 14
