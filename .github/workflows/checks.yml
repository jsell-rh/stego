name: Dependency environment checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dependency-environment.yml'
      - 'internal/compiler/dependencies.go'
      - 'internal/compiler/dependency_environment_test.go'

permissions:
  contents: read

concurrency:
  group: dependency-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check real Go environment behavior and dependency recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-environment"
          git rev-parse HEAD > "$RUNNER_TEMP/dependency-environment/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/dependency-environment/source-archive.sha256"
          go mod verify
          go test -json -race -count=1 -mod=readonly -timeout=3m ./internal/compiler \
            -run '^Test(Dependency.*|ResolvedModuleCannotLowerComponentMinimum)$' \
            | tee "$RUNNER_TEMP/dependency-environment/tests.jsonl"
          python3 - "$RUNNER_TEMP/dependency-environment/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass'}
          required = {'TestDependencyResolutionIgnoresSavedSourceOverlay',
                      'TestDependencyCommandsPreserveSavedProxyConfiguration'}
          assert required <= passed
          assert not any(e.get('Action') in ('fail', 'skip') for e in events)
          PYCHECK
          git diff --exit-code
      - name: Retain dependency results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-environment-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-environment/
          if-no-files-found: error
          retention-days: 14
