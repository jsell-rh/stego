name: Application Pod rules

on:
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Resolve the declared dependency change and retain the review patch
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/allocation-pod-rules.yml'
      - 'internal/generator/kubernetesservice/allocation_pod*'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: application-pod-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Resolve dependency candidate
        if: inputs.refresh_dependencies == true
        run: go mod tidy
      - name: Check application rules and common guards
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pod-rules"
          git rev-parse HEAD > "$RUNNER_TEMP/pod-rules/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/pod-rules/source-archive.sha256"
          go mod verify
          go test -v -race -count=1 -mod=readonly -timeout=4m ./internal/generator/kubernetesservice \
            -run '^(TestAllocationPodRule.*|TestAllocationIsolated.*|TestGeneratedIsolatedAllocationRuntime)$' \
            | tee "$RUNNER_TEMP/pod-rules/tests.log"
      - name: Retain dependency candidate
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pod-rules"
          cp go.mod go.sum "$RUNNER_TEMP/pod-rules/"
          git diff --binary -- go.mod go.sum > "$RUNNER_TEMP/pod-rules/dependencies.patch"
      - name: Require unchanged dependencies
        if: inputs.refresh_dependencies != true
        run: git diff --exit-code -- go.mod go.sum
      - name: Retain rule evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: application-pod-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pod-rules
          retention-days: 14
          if-no-files-found: error
