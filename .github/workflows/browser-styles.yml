name: Browser style checks

on:
  push:
    paths:
      - 'internal/generator/browserdom/**'
      - 'scripts/check-browser-styles.py'
      - 'scripts/check-monaco-adapter.py'
      - '.github/workflows/browser-styles.yml'
  pull_request:
    paths:
      - 'internal/generator/browserdom/**'
      - 'scripts/check-browser-styles.py'
      - 'scripts/check-monaco-adapter.py'
      - '.github/workflows/browser-styles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-styles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.1'
      - name: Check the reviewed editor source adapter
        run: python3 scripts/check-monaco-adapter.py --output "$RUNNER_TEMP/browser-styles/monaco.json"
      - name: Check strict browser style operations
        run: python3 scripts/check-browser-styles.py --output "$RUNNER_TEMP/browser-styles/result.json"
      - name: Retain the browser result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-styles-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-styles
          if-no-files-found: error
          retention-days: 7
