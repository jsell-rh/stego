name: Compiler artifact check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compiler-artifact.yml'
      - 'scripts/check-compiler-artifact.py'
      - 'scripts/test_compiler_artifact.py'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/compiler-artifact.yml'
      - 'scripts/check-compiler-artifact.py'
      - 'scripts/test_compiler_artifact.py'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: compiler-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check artifact input and process limits
        run: timeout --signal=TERM --kill-after=5s 20s python3 -B scripts/test_compiler_artifact.py
      - name: Build twice with separate source trees and caches
        run: |
          timeout --signal=TERM --kill-after=5s 18m python3 -B scripts/check-compiler-artifact.py \
            --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --work "$RUNNER_TEMP/compiler-builds" --output "$RUNNER_TEMP/compiler-artifact" \
            --go "$(command -v go)"
      - name: Save the checked compiler and build record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/compiler-artifact/
          if-no-files-found: error
          retention-days: 7
