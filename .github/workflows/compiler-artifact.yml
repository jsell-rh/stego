name: Compiler artifact check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compiler-artifact.yml'
      - 'scripts/check-compiler-artifact.py'
      - 'scripts/test_compiler_artifact.py'
      - 'scripts/verify-compiler-artifact.py'
      - 'scripts/test_compiler_verification.py'
      - 'scripts/check-compiler-provenance.py'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/compiler-artifact.yml'
      - 'scripts/check-compiler-artifact.py'
      - 'scripts/test_compiler_artifact.py'
      - 'scripts/verify-compiler-artifact.py'
      - 'scripts/test_compiler_verification.py'
      - 'scripts/check-compiler-provenance.py'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: compiler-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      binary-sha256: ${{ steps.build.outputs.binary-sha256 }}
      record-sha256: ${{ steps.build.outputs.record-sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check artifact input and process limits
        run: |
          timeout --signal=TERM --kill-after=5s 20s python3 -B scripts/test_compiler_artifact.py
          timeout --signal=TERM --kill-after=5s 20s python3 -B scripts/test_compiler_verification.py
      - name: Build twice with separate source trees and caches
        id: build
        run: |
          timeout --signal=TERM --kill-after=5s 18m python3 -B scripts/check-compiler-artifact.py \
            --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --work "$RUNNER_TEMP/compiler-builds" --output "$RUNNER_TEMP/compiler-artifact" \
            --go "$(command -v go)"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'compiler-artifact'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, name in [('binary-sha256', 'stego-linux-amd64'), ('record-sha256', 'build.json')]:
                  with (root / name).open('rb') as source:
                      output.write(key + '=' + hashlib.file_digest(source, 'sha256').hexdigest() + '\n')
          PY
      - name: Save the checked compiler and build record
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/compiler-artifact/
          if-no-files-found: error
          retention-days: 7

  provenance:
    if: github.repository == 'jsell-rh/stego' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Retrieve the checked artifact from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.linux-amd64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/compiler-artifact
      - name: Require the exact bytes checked by the build job
        env:
          BINARY_SHA256: ${{ needs.linux-amd64.outputs.binary-sha256 }}
          RECORD_SHA256: ${{ needs.linux-amd64.outputs.record-sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'compiler-artifact'
          for key, name, limit in [('BINARY_SHA256', 'stego-linux-amd64', 64 << 20), ('RECORD_SHA256', 'build.json', 1 << 20)]:
              expected = os.environ[key]
              if not re.fullmatch('[0-9a-f]{64}', expected):
                  raise SystemExit('The build job did not supply a valid digest')
              descriptor = os.open(root / name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, 'rb') as source:
                  info = os.fstat(source.fileno())
                  if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= limit:
                      raise SystemExit('The downloaded input is not a bounded regular file')
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              if digest != expected:
                  raise SystemExit('The downloaded bytes differ from the checked build')
          PY
      - name: Sign the compiler and build record
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/compiler-artifact/stego-linux-amd64
            ${{ runner.temp }}/compiler-artifact/build.json
      - name: Verify origin and reject changed inputs
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          timeout --signal=TERM --kill-after=5s 7m python3 -B scripts/check-compiler-provenance.py \
            --inputs "$RUNNER_TEMP/compiler-artifact" --bundle "$ATTESTATION_BUNDLE" \
            --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/compiler-provenance" \
            --gh "$(command -v gh)"
      - name: Save verified provenance and rejection results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/compiler-provenance/
          if-no-files-found: error
          retention-days: 7
