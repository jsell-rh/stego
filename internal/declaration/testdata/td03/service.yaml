kind: service
name: todo-svc
archetype: rest-crud
language: go
base_path: /api/todo/v1
tenancy:
  kind: pooled
  key: tenant_id
  claim: tenant
  provisioning: {resource_type: "document", provision: edit, retire: edit}
experimental_acceptances:
  - {component: spicedb-authz, accepted_until: 2027-04-30, reason: the authorization tests take the alpha component}
  - {component: tenancy, accepted_until: 2027-04-30, reason: authorization needs pooled tenancy}
authorization:
  provider: spicedb
  schema_path: authz/schema.zed
  subject_from_identity: user
entities:
  - name: Todo
    fields:
      - {name: title, type: string, min_length: 1, max_length: 255}
      - {name: done, type: bool, default: false}
      - {name: owner_id, type: string}
    resource_type: document
    permissions: {create: edit, read: view, update: edit, delete: edit, list: view}
    relationships:
      - {relation: owner, subject_source: field, subject_field: owner_id, subject_type: user}
collections:
  todos:
    entity: Todo
    operations: [create, read, update, delete, list]
