syntax = "proto3";
package stego.components.rest_api.slots;
import "stego/common/types.proto";

service AfterCreate {
  rpc Evaluate(AfterCreateRequest) returns (stego.common.SlotResult);
}

message AfterCreateRequest {
  string entity = 1;
  map<string, string> persisted_fields = 2;
  stego.common.Identity caller = 3;
}
