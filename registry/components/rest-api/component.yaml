kind: component
name: rest-api
version: 3.0.2
output_namespace: internal/api

config:
  expose:
    type: list
    items:
      entity:
        type: entity-ref
      operations:
        type: list
        items:
          enum: [create, read, update, delete, list, upsert, patch]
      scope:
        type: field-ref
        optional: true
      parent:
        type: entity-ref
        optional: true
      path_prefix:
        type: string
        optional: true
      upsert_key:
        type: list
        items:
          type: field-ref
        optional: true
      concurrency:
        type: string
        enum: [optimistic]
        optional: true

requires:
  - auth-provider
  - storage-adapter

provides:
  - http-server
  - openapi-spec

slots:
  - name: before_create
    proto: stego.components.rest_api.slots.BeforeCreate
    default: passthrough
  - name: before_upsert
    proto: stego.components.rest_api.slots.BeforeUpsert
    default: passthrough
  - name: before_patch
    proto: stego.components.rest_api.slots.BeforePatch
    default: passthrough
  - name: before_delete
    proto: stego.components.rest_api.slots.BeforeDelete
    default: passthrough
  - name: after_create
    proto: stego.components.rest_api.slots.AfterCreate
    default: passthrough
  - name: after_upsert
    proto: stego.components.rest_api.slots.AfterUpsert
    default: passthrough
  - name: after_patch
    proto: stego.components.rest_api.slots.AfterPatch
    default: passthrough
  - name: after_delete
    proto: stego.components.rest_api.slots.AfterDelete
    default: passthrough
  - name: validate
    proto: stego.components.rest_api.slots.Validate
    default: passthrough
