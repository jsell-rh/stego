# The rest-api component serves each declared collection on the runtime data path, the one data path
# (ST-SUP-RC20-OC39): each collection operation is one generated command or query of the command and query
# components, which a service with collections must therefore have. Version 4.0.0 removed the handlers of the store
# path and their storage interface. Version 4.2.0 stages the change event of each write when the service has the
# kafka-producer component (ST-SUP-RC20-OC40).
kind: component
name: rest-api
version: 4.2.0
stage: ga
output_namespace: internal/api

config:
  expose:
    type: list
    items:
      entity:
        type: entity-ref
      operations:
        type: list
        items:
          enum: [create, read, update, delete, list, upsert, patch]
      scope:
        type: field-ref
        optional: true
      parent:
        type: entity-ref
        optional: true
      path_prefix:
        type: string
        optional: true
      upsert_key:
        type: list
        items:
          type: field-ref
        optional: true
      concurrency:
        type: string
        enum: [optimistic]
        optional: true

requires:
  - auth-provider
  - storage-adapter

provides:
  - http-server
  - openapi-spec

slots:
  - name: before_create
    proto: stego.components.rest_api.slots.BeforeCreate
    default: passthrough
  # before_upsert and after_upsert are declared, and a binding of them is refused: only the removed store path
  # called them (ST-SUP-RC20-OC39). An upsert calls validate and on_entity_changed.
  - name: before_upsert
    proto: stego.components.rest_api.slots.BeforeUpsert
    default: passthrough
  - name: before_patch
    proto: stego.components.rest_api.slots.BeforePatch
    default: passthrough
  - name: before_delete
    proto: stego.components.rest_api.slots.BeforeDelete
    default: passthrough
  - name: after_create
    proto: stego.components.rest_api.slots.AfterCreate
    default: passthrough
  - name: after_upsert
    proto: stego.components.rest_api.slots.AfterUpsert
    default: passthrough
  - name: after_patch
    proto: stego.components.rest_api.slots.AfterPatch
    default: passthrough
  - name: after_delete
    proto: stego.components.rest_api.slots.AfterDelete
    default: passthrough
  - name: validate
    proto: stego.components.rest_api.slots.Validate
    default: passthrough
