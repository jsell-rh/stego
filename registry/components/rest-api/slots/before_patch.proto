syntax = "proto3";
package stego.components.rest_api.slots;
import "stego/common/types.proto";

service BeforePatch {
  rpc Evaluate(BeforePatchRequest) returns (stego.common.SlotResult);
}

message BeforePatchRequest {
  string entity = 1;
  map<string, string> patch_fields = 2;
  map<string, string> existing_entity = 3;
  stego.common.Identity caller = 4;
}
