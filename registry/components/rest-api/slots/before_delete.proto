syntax = "proto3";
package stego.components.rest_api.slots;
import "stego/common/types.proto";

service BeforeDelete {
  rpc Evaluate(BeforeDeleteRequest) returns (stego.common.SlotResult);
}

message BeforeDeleteRequest {
  string entity = 1;
  string entity_id = 2;
  stego.common.Identity caller = 3;
}
