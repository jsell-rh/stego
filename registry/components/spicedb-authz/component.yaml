# Version 1.1.0 holds the revocation status route in the operation-to-permission table, from which alone the router
# registers it (ST-SUP-RC29-OC18), and the settings wait_cap, waiter_limit and tenant_waiter_limit of a wait for a
# revocation (ST-SUP-RC29-OC19). Version 1.1.1 refuses a wait_cap above 25 s, so a full wait leaves time to answer
# before the server's write timeout of 30 s. Version 1.1.2 adds authz_token only when the catalog does not hold it, so
# a run again of the migration job takes no lock on a protected table (ST-SUP-RC29-OC06). Version 1.1.3 refuses an
# alert_bound above 10 minutes and a watch_interval below 100 ms or above the alert_bound (ST-SUP-RC29-OC24). Version
# 1.1.4 quotes the table name in the authz migration as an identifier and as a string literal (ST-SUP-RC29-OC06).
kind: component
name: spicedb-authz
version: 1.1.4
stage: ga
output_namespace: internal/authz

config:
  alert_bound:
    type: string
    default: 5s
  watch_interval:
    type: string
    default: 1s
  wait_cap:
    type: string
    default: 10s
  waiter_limit:
    type: int
    default: 100
  tenant_waiter_limit:
    type: int
    default: 10

requires:
  - auth-provider

provides:
  - authz-decision
  - authz-relationships

slots: []
