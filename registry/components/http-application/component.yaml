kind: component
name: http-application
version: 1.13.0
output_namespace: application
config:
  factory_package:
    type: string
  document:
    type: string
  references:
    type: list
    items:
      type: string
  response_mappings:
    type: list
    items:
      name:
        type: string
      provider:
        type: string
      model:
        type: string
      schema:
        type: string
      inputs:
        type: list
        optional: true
        items:
          name:
            type: string
          type:
            type: string
          optional:
            type: bool
            optional: true
      fields:
        type: list
        items:
          target:
            type: string
          source:
            type: string
            optional: true
          input:
            type: string
            optional: true
          constant:
            type: string
            optional: true
          prefix:
            type: string
            optional: true
          conversion:
            type: string
            optional: true
          max_bytes:
            type: int
            optional: true
          max_items:
            type: int
            optional: true
          max_item_bytes:
            type: int
            optional: true
          omit:
            type: bool
            optional: true
          omit_empty:
            type: bool
            optional: true
          on_absent:
            type: string
            optional: true
requires:
  - storage-adapter
  - auth-provider
provides:
  - application-http
slots: []
