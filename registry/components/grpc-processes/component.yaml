kind: component
name: grpc-processes
version: 1.0.0
output_namespace: grpcapi
config:
  processes:
    type: list
    items:
      name:
        type: string
      factory_package:
        type: string
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
requires:
  - auth-provider
  - tracing
provides:
  - application-grpc-processes
slots: []
