kind: component
name: grpc-processes
version: 1.3.0
output_namespace: grpcapi
config:
  response_mappings:
    type: list
    items:
      name:
        type: string
      provider:
        type: string
      model:
        type: string
      message:
        type: string
      fields:
        type: list
        items:
          target:
            type: string
          source:
            type: string
            optional: true
          constant:
            type: string
            optional: true
          prefix:
            type: string
            optional: true
          conversion:
            type: string
            optional: true
          omit:
            type: bool
            optional: true
  processes:
    type: list
    items:
      name:
        type: string
      factory_package:
        type: string
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
requires:
  - auth-provider
  - tracing
provides:
  - application-grpc-processes
slots: []
