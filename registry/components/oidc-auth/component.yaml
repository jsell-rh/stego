kind: component
name: oidc-auth
version: 0.1.1
stage: ga
output_namespace: internal/auth

# Sign-in with any OpenID Connect provider on the runtime data path (ST-SUP-RC37). The verifier of the runtime
# library finds the key set of the issuer through its discovery document and verifies each token; the component
# emits no code of its own. It enters at ga (ST-SUP-Q99, Product owner, 2026-11-11), so it provides the port
# auth-provider beside the ga jwt-auth and rh-sso-auth (ST-SUP-INV03).

config:
  issuer:
    type: string
  audience:
    type: string
  algorithms:
    type: list
    items:
      type: string
    default: ["RS256"]
  subject_claim:
    type: string
    default: sub
  roles_claim:
    type: string
    optional: true
  header:
    type: string
    default: Authorization
  ca_file:
    type: string
    optional: true

requires: []

provides:
  - auth-provider

slots: []
