kind: archetype
name: rest-crud
language: go
version: 3.32.0
# The runtime library that every service of this archetype imports (ST-SUP-INV10). It is the module in
# registry/runtime, released with the common registry by the tag registry/runtime/<version>; sum is the go.sum hash
# of that folder at the version. A new runtime version moves it in a new archetype version.
runtime:
  module: github.com/jsell-rh/stego/registry/runtime
  version: v0.31.0
  sum: h1:B1xTvvjhes5wbA6z4mOAY5qwmUGy4M+S3xwQ8gL03lM=

components:
  - rest-api
  - postgres-adapter
  - tsl-search
  - otel-tracing
  - health-check

default_auth: jwt-auth

conventions:
  layout: flat
  error_handling: problem-details-rfc
  response_format: envelope
  logging: structured-json
  test_pattern: table-driven
  request_validation: openapi-schema
  cors: enabled

compatible_mixins:
  - event-publisher
  - async-worker

bindings:
  durable-outbox: outbox
  storage-adapter: postgres-adapter
  auth-provider: jwt-auth
