kind: mixin
name: event-publisher
version: 3.0.0

# A deprecated alias of durable-events and kafka-events (ST-SUP-INV17): binding it binds both. Its slot contract
# stays at slots/on_entity_changed.proto, so a fill that implements event-publisher.on_entity_changed keeps its
# contract digest.
alias_of:
  - durable-events
  - kafka-events

adds_components: []

adds_slots: []

overrides: none
